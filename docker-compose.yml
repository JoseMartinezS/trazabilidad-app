version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trazabilidad-db
    environment:
      POSTGRES_USER: trazabilidad
      POSTGRES_PASSWORD: trazabilidad123
      POSTGRES_DB: trazabilidad
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/config/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trazabilidad -d trazabilidad"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trazabilidad-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trazabilidad.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
