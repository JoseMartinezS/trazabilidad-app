version: "3.8"

services:
  db:
    build:
      context: ..
      dockerfile: backend/Dockerfile.db
    container_name: trazabilidad-db
    environment:
      POSTGRES_USER: trazabilidad
      POSTGRES_PASSWORD: trazabilidad123
      POSTGRES_DB: trazabilidad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trazabilidad -d trazabilidad"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
